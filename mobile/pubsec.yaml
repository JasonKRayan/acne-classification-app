name: acne_classifier
description: A mobile app for acne classification using AI

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.2

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.3

  # Image Handling
  image_picker: ^1.0.4
  image_cropper: ^5.0.0

  # State Management
  provider: ^6.0.5

  # Local Storage
  shared_preferences: ^2.2.2

  # Charts & Visualization
  fl_chart: ^0.64.0

  # UI Utilities
  loading_animation_widget: ^1.2.0+4
  shimmer: ^3.0.0

  # Permissions
  permission_handler: ^11.0.1

  # Routing
  go_router: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700